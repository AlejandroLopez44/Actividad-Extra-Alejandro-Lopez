<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - E-Commerce UCAB</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 450px;">
        
        <!-- 1. TARJETA DE INICIO DE SESIÓN -->
        <div id="login-card" class="card shadow border-0 p-4">
            <h3 class="text-center mb-4 fw-bold text-primary">Iniciar Sesión</h3>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-control" required placeholder="correo@ucab.edu.ve">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Ingresar</button>
            </form>
            <div class="text-center small">
                <a href="#" id="go-to-forgot" class="d-block mb-2 text-decoration-none">¿Olvidaste tu contraseña?</a>
                <span>¿No tienes cuenta? <a href="#" id="go-to-register" class="text-decoration-none">Regístrate aquí</a></span>
            </div>
        </div>

        <!-- 2. TARJETA DE REGISTRO (Oculta por defecto con d-none) -->
        <div id="register-card" class="card shadow border-0 p-4 d-none">
            <h3 class="text-center mb-4 fw-bold text-success">Crear Cuenta</h3>
            <form id="register-form">
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" id="reg-name" class="form-control" required placeholder="Alejandro López">
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="form-control" required placeholder="correo@ucab.edu.ve">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="reg-password" class="form-control" required placeholder="Mínimo 6 caracteres">
                </div>
                <div class="mb-3">
                    <label class="form-label">Rol de Usuario</label>
                    <select id="reg-role" class="form-select">
                        <option value="Cliente">Cliente (Comprador)</option>
                        <option value="Administrador">Administrador (Gestión)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 mb-3">Registrarse</button>
            </form>
            <div class="text-center small">
                <span>¿Ya tienes cuenta? <a href="#" id="back-to-login-from-reg" class="text-decoration-none">Inicia sesión</a></span>
            </div>
        </div>

        <!-- 3. TARJETA DE RECUPERACIÓN (Oculta por defecto) -->
        <div id="forgot-card" class="card shadow border-0 p-4 d-none">
            <h3 class="text-center mb-4 fw-bold text-warning">Restablecer Contraseña</h3>
            <form id="forgot-form">
                <p class="text-muted small">Ingresa tu correo para buscar tu cuenta y cambiar tu contraseña simulada.</p>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="forgot-email" class="form-control" required placeholder="correo@ucab.edu.ve">
                </div>
                <div class="mb-3 d-none" id="new-password-group">
                    <label class="form-label">Nueva Contraseña</label>
                    <input type="password" id="forgot-new-password" class="form-control" placeholder="••••••••">
                </div>
                <button type="submit" id="forgot-submit-btn" class="btn btn-warning w-100 py-2 mb-3 text-white">Verificar Correo</button>
            </form>
            <div class="text-center small">
                <a href="#" id="back-to-login-from-forgot" class="text-decoration-none">Volver al inicio de sesión</a>
            </div>
        </div>

    </div>

    <!-- Carga de Controladores -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/auth/authController.js"></script>
</body>
</html>
