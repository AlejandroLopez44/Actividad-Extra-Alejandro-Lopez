<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - UCAB Store</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">

    <!-- Navbar del Administrador -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">⚙️ UCAB Admin Panel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <button id="theme-toggle" class="btn btn-outline-light btn-sm">🌙 Modo Noche</button>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown">
                            <img id="admin-avatar" src="" alt="Admin" class="rounded-circle border border-2 border-white" width="30" height="30">
                            <span id="admin-name-display" class="ms-1">Administrador</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li><a class="dropdown-item text-danger" href="#" id="logout-btn">🚪 Cerrar Sesión</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">📦 Gestión de Inventario</h2>
            <!-- Botón para abrir el modal de Creación -->
            <button class="btn btn-success shadow-sm fw-bold" data-bs-toggle="modal" data-bs-target="#productModal" id="btn-add-product">
                ➕ Nuevo Producto
            </button>
        </div>

        <!-- Tabla de Productos -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0 overflow-auto">
                <table class="table table-hover align-middle mb-0 text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Nombre del Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <!-- JS inyectará las filas aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ================= MODAL CRUD (CREAR / EDITAR) ================= -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white border-0">
                    <h5 class="modal-title" id="productModalLabel">Añadir Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="product-form">
                        <!-- Input oculto para saber si estamos editando (guardará el ID) -->
                        <input type="hidden" id="prod-id">
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre del Producto</label>
                            <input type="text" id="prod-title" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Precio ($)</label>
                                <input type="number" id="prod-price" class="form-control" step="0.01" min="0.1" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Categoría</label>
                                <!-- Lo dejaremos como texto libre, o podrías usar un select -->
                                <input type="text" id="prod-category" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">URL de la Imagen</label>
                            <input type="url" id="prod-image" class="form-control" placeholder="https://..." required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="btn-save-product">Guardar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin.js"></script> <!-- Archivo JS nuevo para el admin -->
</body>
</html>
